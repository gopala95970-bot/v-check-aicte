services:
  - type: web
    name: vcheck-aicte
    runtime: docker
    plan: free
    dockerfilePath: ./vcheck-aicte/Dockerfile
    dockerContext: ./vcheck-aicte
    healthCheckPath: /api/v1/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: "1"
