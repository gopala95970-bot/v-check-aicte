# One-click deploy on Render (free web service): New > Blueprint > pick this repository.
services:
  - type: web
    name: vcheck-aicte
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: "1"
